pipeline:
  enabled_stages:
    - profiling
    - exploration
    - dimensionality
    - autoencoder
    - unsupervised
    - supervised
    - findings
  fail_fast: false
  cache_state: false

report:
  title: "Explot Report"
  include_debug: false

budget:
  mode: fast
  max_fit_rows: 8000
  max_fit_rows_fast: 3000
  leakage_delta_threshold: 0.10
  leakage_score_floor: 0.60
  verdict_lift_floor: 0.05
